/* Reading comfort: larger type, deeper sage surfaces, and stronger contrast. */
:root {
  --paper: #cfd8c3;
  --white: #f7f7ee;
  --ink: #1f3025;
  --muted: #42543a;
  --green: #31543a;
  --green-dark: #203f29;
  --pale: #dbe5ce;
  --line: #aab99b;
  --orange: #795029;
  --orange-pale: #efe0c6;
  --shadow: 0 5px 18px #203c2010;
}
body { font-size: 17px; line-height: 1.8; }
.sidebar { background: #e3e9d8; overflow-y: auto; }
.brand small { font-size: 10px; letter-spacing: 1px; color: var(--muted); }
.space-label { font-size: 14px; letter-spacing: .4px; }
nav a { font-size: 17px; font-weight: 500; }

.sidebar-bottom { padding-top: 24px; }

.topbar { background: #e8eddf; }
.breadcrumb, .date-label { color: #46583e; }
.footer, .footer button { color: #3e5234; font-size: 13px; }
.page-heading { flex-wrap: wrap; }
.page-heading>div { min-width: 0; }
.page-heading h1 { font-size: 30px; }

.outline-btn, .primary-btn, .light-btn { min-height: 44px; font-size: 16px; }
.outline-btn { background: #e5ecd9; color: #2f4828; border-color: #869c73; }

.card, .stat { background: #f7f7ee; border-color: #aab99b; }

}

.chip { font-size: 15px; color: #364e2d; border-color: #a2b68c; background: #eef1e3; min-height: 40px; }

.lesson-heading { flex-wrap: wrap; border-color: #bfccb0; }

.quiz-top, .question-label { font-size: 14px; }
.quiz-top { flex-wrap: wrap; }
.question-en { font-size: 23px; color: #223d1e; }
.question-zh { font-size: 19px; color: #3d5331; }

.vocab-inline span { font-size: 15px; }
.quiz-bottom { flex-wrap: wrap; }
.quiz-bottom>span { font-size: 15px; }
.quiz-side p { font-size: 16px; }
.quiz-side h3, .quiz-mode h3 { font-size: 19px; }
.quiz-mode p, .practice-stats span { font-size: 16px; }

/* Every daily task has its own route, instructions, materials and next step. */
.task-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px; cursor: default; }
.task-toggle { display: flex; align-items: flex-start; gap: 13px; min-width: 0; cursor: pointer; }
.task-toggle input { margin-top: 6px; }
.task-enter { font-size: 15px; padding: 10px 13px; white-space: nowrap; }
.task-workspace { padding: 28px 30px; }
.task-stepper { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 25px; }
.task-step { display: flex; align-items: center; gap: 11px; text-align: left; padding: 14px; border: 1px solid #a5b994; border-radius: 9px; background: #e7eddc; color: #3d5630; min-width: 0; }
.task-step>span { display: grid; place-items: center; width: 29px; height: 29px; flex-shrink: 0; border: 1px solid #9eb38a; border-radius: 50%; font-size: 16px; }
.task-step>span .icon { width: 17px; height: 17px; }
.task-step strong { font-size: 16px; line-height: 1.7; font-weight: 500; overflow-wrap: anywhere; }
.task-step.current { background: #31543a; color: #f4f7e9; border-color: #31543a; box-shadow: 0 0 0 2px #b2c6a0; }
.task-step.current>span { border-color: #cadcb7; }
.task-step.complete:not(.current)>span { background: #d0dfbf; color: #2e4c24; }
.task-assignment { font-size: 18px; line-height: 1.9; padding: 18px 21px; background: #e2ead6; border-left: 4px solid #789761; border-radius: 0 8px 8px 0; color: #30472a; }
.task-guide-section { margin-top: 29px; }
.task-guide-section h2 { font-size: 21px; margin-bottom: 14px; color: #294322; }
.guided-steps { padding-left: 28px; margin: 0; color: #30472a; font-size: 18px; line-height: 2; }
.guided-steps li { padding-left: 5px; margin-bottom: 14px; }
.guided-steps li::marker { color: #496838; font-weight: 600; }
.task-resources { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.task-resource { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; text-align: left; background: #e3ebd7; color: #294322; border: 1px solid #93ac7c; border-radius: 10px; padding: 18px 20px; min-width: 0; }
.task-resource:hover { background: #d7e4c9; border-color: #5f8148; }
.resource-type { font-size: 14px; color: #4a623b; }
.task-resource strong { font-size: 18px; font-weight: 550; line-height: 1.8; overflow-wrap: anywhere; }

window.STUDY_DATA = {
  exam: {
    level: 'CFA Level I',
    language: '考试题目为英文；本站中文用于搭桥，练习时要逐渐保留英文题干。',

    sessionMinutes: 135,
    optionsPerQuestion: 3,
    timing: '通常为两节，每节 90 题、135 分钟，约每题 90 秒；两节之间有可选休息。以你的准考证和官方说明为准。',
    scoring: '答错通常不倒扣分。没有可预先保证通过的固定分数线；本站正确率仅反映这组基础题。',
    psm: '实用技能模块（PSM）独立于选择题考试。近年要求每级至少完成一个指定模块，通常约 10–20 小时；须在官方成绩发布截止时间前完成，才能获得成绩。先登录候选人账户核对个人要求与截止日；若允许，可安排在笔试后，勿挤占考前核心复习。',
    caveat: '近年公开结构参考，非你的考季保证。本站仅提供入门骨架与原创基础练习，不是完整官方考纲或教材。本站无法联网核验 CFA 官网（代理访问返回 403），请以所报考年份的官方考纲、Learning Ecosystem、考试预约及 PSM 要求为准。',
    practiceNotice: '本站 32 道原创基础题用于学概念和看懂英文，难度与覆盖面不等于正式考试。第 16–17 天的模拟须使用官方 Learning Ecosystem 或你合法获得的完整模拟卷。'
  },
  methods: [
    { title: '先测再学', text: '第 1 天做 8 道混合基础题，记录错因：概念、英语、计算或粗心。样本很小，只用于决定先补什么，不用于预测能否通过。' },
    { title: '闭卷回忆', text: '每学 25–35 分钟，合上材料，用中文说出定义、公式和一个例子；说不出再回看。看懂与能独立做题是两件事。' },
    { title: '间隔 1 / 3 / 7 天', text: '新内容先在次日回忆；记住后把下次复习间隔依次拉长为 3、7 天，忘记则退回次日。先独立作答，再看解析；看网站显示的具体到期日，不反复抄整章笔记。' },
    { title: '交错练习', text: '基础概念初步掌握后，把两到三个科目的题混合练习，训练判断该用哪个方法。先做题，再看答案，最后写一句错因。' },
    { title: '读英文先找任务', text: '先圈 most likely、least likely、except、increase、decrease；再找已知量与单位。先读懂问什么，允许起步时借助中文，逐步减少整句翻译。' },
    { title: '每天保留伦理', text: '每天短练 2–5 道伦理情境题并解释理由。伦理有较高权重且依赖情境辨析，不适合全部压到最后一天。' },
    { title: '保护睡眠与恢复', text: '保证通常 7–9 小时睡眠；疲劳时缩短任务而不熬通宵。最后一天只复习熟悉内容、查证件与路线，不再开新章。' },
    { title: '按证据调整', text: '每 3 天看一次错因分布。若概念仍不懂，减少刷题数量并回到例子；若中文会做而英文不会，增加短题干训练。优先修复反复错的高权重基础。' }
  ],
  topics: [
    { id:'ethics', name:'职业伦理', en:'Ethical and Professional Standards', weight:'15–20%', min:15, max:20, priority:'每日必学', description:'理解投资从业者应该如何对待客户、市场和职业义务，靠辨析情境而不是背口号。', takeaways:['诚信与独立判断：不歪曲事实，不让礼物或报酬影响客观性。','重大非公开信息：既重大又未公开的信息，不用于交易，也不诱使他人交易。','客户利益优先，公平对待客户；披露利益冲突并不自动消除所有违规。','推荐投资应有合理依据，考虑客户目标、风险承受能力和限制。','业绩呈现要公平、准确、完整；“保证收益”需要警惕。'], formula:'先问：谁受影响 → 有什么义务 → 信息是否重大且未公开 → 应如何行动？', example:'分析师提前收到未公开的盈利大幅下滑消息。即使客户可能损失，也不能用该信息安排交易。应限制使用并遵守合规程序。' },
    { id:'quant', name:'定量方法', en:'Quantitative Methods', weight:'6–9%', min:6, max:9, priority:'基础先修', description:'从百分比、时间价值和统计直觉开始。先会解释输入、输出和单位，再记公式。', takeaways:['百分比变动 =（新值 − 旧值）/旧值；百分比与百分点不同。','钱有时间价值：未来同额的钱通常不如今天的钱值钱。','均值描述中心，方差与标准差描述波动，相关关系不等于因果。','期望值是各结果按概率加权的平均；概率之和应为 1。','假设检验中，p 值不是“原假设为真的概率”；与显著性水平比较后作判断。'], formula:'FV = PV × (1 + r)^n；PV = FV / (1 + r)^n', example:'今天存 100 元，年利率 5%，两年后 FV = 100 × 1.05² = 110.25 元；r 用 0.05 而不是 5。' },
    { id:'economics', name:'经济学', en:'Economics', weight:'6–9%', min:6, max:9, priority:'理解方向', description:'建立供需、周期、通胀、政策和汇率的方向感。', takeaways:['其他条件不变，需求曲线通常向右下倾斜；价格变化是沿曲线移动。','需求增加使需求曲线右移；均衡价格通常上升。','名义变量未扣通胀，实际变量扣除通胀影响。','紧缩货币政策通常通过提高利率等方式抑制需求，但结果取决于条件。','汇率必须看报价方向；USD/CNY 变化的含义不能只看“升”“降”。'], formula:'近似实际收益率 ≈ 名义收益率 − 通胀率', example:'名义收益 6%，通胀 2%，实际收益约 4%；精确值 1.06 / 1.02 − 1 ≈ 3.92%。' },
    { id:'fsa', name:'财务报表分析', en:'Financial Statement Analysis', weight:'11–14%', min:11, max:14, priority:'高权重主线', description:'先读懂公司有什么、欠什么、赚了多少、现金去了哪里。', takeaways:['资产负债表是某一时点：资产 = 负债 + 所有者权益。','利润表是一个期间的经营结果；利润不等于现金流。','现金流量表区分经营、投资、融资活动；注意 IFRS 与 US GAAP 分类可能不同。','应收账款增长可能增加收入却未带来现金；必须理解权责发生制。','分析比率要比较时期、行业及会计口径，不能用一个数字判定公司好坏。'], formula:'流动比率 = 流动资产 / 流动负债；毛利率 =（收入 − 销售成本）/ 收入', example:'收入 100，销售成本 60，毛利率 = 40%；流动资产 120，流动负债 80，流动比率 = 1.5。' },
    { id:'corporate', name:'公司发行人', en:'Corporate Issuers', weight:'6–9%', min:6, max:9, priority:'衔接财报', description:'理解公司融资、治理和投资项目决策。', takeaways:['债权人与股东的权利、风险、回报不同。','公司治理用制度约束代理冲突；管理层利益未必总与股东一致。','资本预算比较项目的未来现金流，不能只看会计利润。','净现值使用适当折现率；其他条件相同，正 NPV 项目增加价值。','营运资本管理关注库存、应收、应付和现金转换周期。'], formula:'NPV = 未来现金流现值之和 − 初始投资', example:'投入 100，一年后收到 110，要求回报率 5%，NPV = 110 / 1.05 − 100 ≈ 4.76，价值增加。' },
    { id:'equity', name:'权益投资', en:'Equity Investments', weight:'11–14%', min:11, max:14, priority:'高权重主线', description:'股票代表所有权；先理解市场如何交易，再学如何估值。', takeaways:['普通股是剩余索取权；清算时通常在债权人之后。','市价单优先成交但不保证价格；限价单限制价格但不保证成交。','有效市场讨论价格如何反映信息，不等于价格永远没有波动。','估值必须区分价格与价值，比较指标要使用一致口径。','股利贴现模型依赖长期假设；永续增长模型要求 r > g。'], formula:'P/E = 每股价格 / 每股收益；固定增长 DDM：V₀ = D₁ / (r − g)', example:'下一年股利 D₁ 为 2，要求回报率 10%，长期增长率 2%，估值 = 2 / 0.08 = 25。不是用当期股利直接代入。' },

  ],[words(['fsa','corporate'],10,'复习财报与公司术语'),lesson('corporate','理解股东、债权人与治理'),note('比较两类出资人的权利与风险')],['复习了旧词而非直接翻看释义。','能用一个例子说明股东与债权人的差别。'],'普通股是“剩余索取权”，这句话中的“剩余”指什么？');

  add(6,2,'先折现，再判断项目是否增加价值',[
    '打开公司讲解，写下 NPV = 未来现金流现值之和 − 初始投资；特别圈出“现金流”。',
    '独立完成“今天投入 90、明年收到 100、折现率 10%”的自测，先求现值再减投入。',
    '把正 NPV 的含义用中文说清：在估计和折现率合理的前提下增加价值，不是保证赚钱。'
  ],[lesson('corporate','理解净现值与资本预算'),check('corporate','手算一个单期 NPV'),words(['corporate','quant'],8,'对应 net present value 与 discount rate')],['能够按现值减初始投资计算一次 NPV。','解释中包含现金流估计和折现率前提。'],'为什么不能直接用“明年收入减今天支出”代替 NPV？');

  add(6,3,'在公司决策与财报之间切换',[
    '先做公司发行人基础题，判断是项目现金流、治理还是融资权利问题。',
    '再做财报题，提醒自己利润与现金不同；完成短伦理练习，给推荐投资写出合理依据。',
    '从三组题各选一个易混点写在笔记里，回忆时先识别“题目属于什么问题”，再选公式或规则。'
  ],[quiz('topic','公司发行人基础题','corporate'),quiz('topic','交错练财报题','fsa'),quiz('topic','完成伦理短练','ethics'),note('整理三个易混点')],['公司、财报与伦理三组少量基础题已尝试。','能解释至少一次为什么选某个公式或规则。'],'看见一笔支出时，我会怎样区分现金流、费用和资产？');

  add(7,1,'一周后再回忆起点处的错误',[
    '先进入错题重做，优先找第 1 天的概念和反向问法问题；先答，后看解析。',
    '回忆最早学过的定量与伦理词，尤其注意 most likely、least likely 与 nonpublic。',
    '把一周后仍不能解释的问题圈为重点，只留最值得补的两项，今天不补写整本笔记。'
  ],[quiz('wrong','重做还没修好的旧题'),words(['quant','ethics'],11,'一周后重认关键英文词'),note('圈出仍未解决的两个问题')],['旧题和旧词都进行过闭卷回忆。','已把仍薄弱的两项明确写下来。'],'哪些内容我只记住了选项，没有记住理由？');

  add(7,2,'画供需方向，区分名义与实际',[
    '读经济学讲解，画两条简图：沿需求曲线移动与需求曲线右移；先写明“其他条件不变”。',
    '完成名义收益 5%、通胀 3% 的自测，先估方向，再算精确实际收益；不要把近似差额当精确值。',
    '选定一个汇率报价并写清“1 单位谁等于多少谁”，再判断数字上涨分别意味着哪一方升值；不背脱离报价的方向。'
  ],[lesson('economics','看供需、通胀与汇率方向'),check('economics','动手算实际收益率'),words(['economics','quant'],10,'认识经济学方向词'),note('画两张供需图与一条汇率报价')],['能画出曲线移动与沿曲线移动的区别。','实际收益已独立计算，汇率判断标明了报价方向。'],'为什么同一个汇率“上升”，不能脱离报价方向直接说本币升值？');

  add(7,3,'做经济题，再拆三句英文',[
    '完成经济学基础题，作答前标出条件变化和被问变量；再练一组定量题检查单位。',
    '打开英文拆句，独立翻译债券收益率变化、折现率变化和时间单位这三句，不逐字硬译。',
    '对每句只写“条件 → 被问结果”，再核对中文，把翻反的方向词留下。'
  ],[quiz('topic','做经济学基础题','economics'),quiz('topic','交错练定量题','quant'),read(['read-1','read-4','read-5'],'拆解 3 条条件与方向句'),note('写三条“条件 → 结果”')],['两科基础题已独立尝试。','三句英文都先自己翻译、后对照核对。'],'我是在翻译每个词，还是已经找到了条件和所问结果？');

  add(8,1,'复习利润率，再理解每股收益',[
    '先回忆毛利率的分子与分母，回到财报讲解检查收入、销售成本和利润的区别。',
    '在一个简化例子中，归属于普通股的利润为 120、加权平均普通股数为 30，基本每股收益为 4；真实题须核对优先股等调整。',
    '在笔记分别写 EPS 与利润率的含义：一个按股数分配收益，一个把利润与收入等基数比较，不能混用。'
  ],[lesson('fsa','回顾收入、利润与比率'),lesson('equity','衔接每股收益与权益估值'),words(['fsa','equity'],10,'复习 earnings、share 和 margin'),note('用自己的话区分 EPS 与利润率')],['毛利率公式能闭卷写出。','能够计算简化 EPS 并说明其分母含义。'],'EPS 上升可能来自利润变化，也可能来自什么变化？');

  add(8,2,'弄清所有权与两种订单',[
    '读权益讲解，先解释普通股代表什么权利，以及清算时为什么通常排在债权之后。',
    '比较市价单与限价单：前者不保证成交价格，后者不保证成交；各举一个你能理解的小情境。',
    '用中文复述“市场价格反映信息”的基本意思，不把有效市场误解为价格永远不会错或每个人都无法赚钱。'
  ],[lesson('equity','理解普通股、市场与订单'),words(['equity','corporate'],9,'认识订单、股利与股东词'),note('给市价单、限价单各举一个例子')],['能解释普通股所有权与清算顺序。','能说明两种订单各自不能保证什么。'],'如果我限制了买入最高价，为什么仍可能买不到？');

  add(8,3,'练权益题，并保留伦理判断',[
    '先独立作答权益基础题，对每个答案说出涉及订单、所有权还是估值。',
    '再完成本站少量伦理题，至少解释两个情境；更多伦理练习应从官方题库补充。',
    '复习 share、earnings、dividend 等词；stock 在金融语境可指股票，而 inventory 在财报中通常指存货，不只按日常英语猜。'
  ],[quiz('topic','做权益基础题','equity'),quiz('topic','练伦理情境','ethics'),words(['equity','fsa'],10,'整理股票、收益与股利词'),note('记录一个英文易混词')],['权益与伦理题都已尝试并阅读解析。','能解释收益、股利和股价不是同一个量。'],'公司盈利增加，为什么不代表每股股利一定等额增加？');

  add(9,1,'把定量、公司与股票的薄弱点连起来',[
    '先重做旧错题，优先回忆第 2 天时间价值、第 6 天 NPV、第 8 天权益概念。',
    '对仍错的内容，只打开对应科目的一个例子重新解释；不因为题目眼熟就直接跳过。',
    '在笔记写一条联系：折现、项目 NPV 与股票估值都在比较现金流、时间与要求回报。'
  ],[quiz('wrong','先重做旧错题'),lesson('quant','补时间价值'),lesson('corporate','补净现值'),lesson('equity','补权益基础'),note('写出三个知识点之间的一条联系')],['已检查三个相关基础模块的薄弱点。','能给至少一个仍错概念重新举例。'],'换了一种题目表述后，我还知道它在问哪个基本关系吗？');

  add(9,2,'先认 D₁，再算股利估值',[
    '读权益公式，先算股价 30、每股收益 3 的 P/E = 10 倍；注意倍数不是百分比。',
    '在固定增长模型自测中先由 D₀ 求 D₁，再检查要求回报率 r 大于增长率 g，最后代入估值公式。',
    '完成自测后改变一个假设想方向：其他条件不变，r 上升使估值怎样变？假设不成立时不要硬套模型。'
  ],[lesson('equity','理解 P/E 与股利贴现模型'),check('equity','算 D₀ 到 D₁ 的估值自测'),note('写 P/E、D₁、r、g 与适用前提')],['已手算一次 P/E 与一次固定增长估值。','计算过程写明 D₁ 和 r > g 的条件。'],'如果题目给的是刚支付的股利，为什么不能直接当 D₁？');

  add(9,3,'混合估值题，专门练反向问法',[
    '先做权益题，再做公司发行人题，每题先判断在问股权价值还是项目价值。',
    '打开 least likely 和 except 的拆句；在草稿上先写“找最不符合项”或“找例外”。',
    '选一个反向问法，将它改写成你能理解的中文，再说明为什么另外两项符合条件。'
  ],[quiz('topic','练权益题','equity'),quiz('topic','交错练公司题','corporate'),read(['read-2','read-3'],'专练 least likely 与 except'),note('改写一道反向题干')],['两科题都已尝试，并区分了估值对象。','能够解释 least likely 与 except 如何改变选择方向。'],'我是在找正确项，还是题目其实让我找错误或例外？');

  add(10,1,'把债券每次收款画出来',[
    '打开固定收益讲解，画一条时间线：今天买入，之后收到票息，到期收到约定本金。',
    '在图上分别标 face value、coupon、maturity；收益率 yield 是由价格和现金流隐含的回报指标，不等于票息金额。',
    '写出一个面值 100、年票息 5、还剩一年到期的现金流：一年后共收到 105；先不把它当今天的价格。'
  ],[lesson('fixed','看懂债券现金流与收益率'),words(['fixed'],8,'认识 8 个债券关键词'),note('画出买入与偿付的时间线')],['时间线上标出了买入、票息与本金。','能区分 coupon、coupon rate 和 yield。'],'同一张债券，票息不变时，为什么买入价格不同会对应不同收益率？');

  add(10,2,'用折现解释债券价格反向变化',[
    '先回顾固定收益与定量讲解，写出一年后现金流除以 1 + 收益率的定价思路。',
    '一年后收到 105：收益率 5% 时价格为 100；收益率 10% 时约为 95.45。先独立计算，再核对。',
    '合上公式，用中文解释收益率要求更高时为什么今天愿意付的价格更低；保留“其他条件不变”。'
  ],[lesson('fixed','理解价格与收益率方向'),lesson('quant','回看现值的除法'),read(['read-1','read-4'],'读懂 yield increases 与 discount rate'),note('写两次折现与一句方向解释')],['两个一年期价格都已独立计算。','能不用死背口号解释价格与收益率的反向关系。'],'当未来现金流固定时，我提高要求回报率，会愿意多付还是少付？');

  add(10,3,'债券题、伦理短练与词卡',[
    '完成固定收益基础题，先标面值、票息、价格与收益率，避免把不同单位代入同一位置。',
    '完成伦理短练，再复习 face value、maturity、yield 等词，自己先说含义再翻面。',
    '在笔记写出一个英文短句，例如收益率上升时普通固定利率债券价格通常下降，并补上适用条件。'
  ],[quiz('topic','练固定收益基础题','fixed'),quiz('topic','完成伦理短练','ethics'),words(['fixed'],8,'建立债券核心词卡'),note('写一句价格与收益率的英文或中英对照句')],['固定收益与伦理基础题都已尝试。','8 个债券词已回忆并核对，薄弱词已标记。'],'题目中的 yield、coupon 和 price，我能分别指出是哪一个数字吗？');

  add(11,1,'先判断方向，再重新计算旧题',[
    '重做仍未修复的旧题，优先看财报比率、权益及昨天的债券方向问题。',
    '每道计算题先写“预计上升或下降”，再按计算器；答案的符号与直觉相反时先查单位。',
    '记录一次方向判断与一次实际计算，说明不一致时你发现了什么问题。'
  ],[quiz('wrong','闭卷重做旧错题'),quiz('topic','无错题时练债券基础','fixed'),note('留下方向判断与计算检查')],['至少对一个旧题重新作答。','计算前后做过一次方向和符号核对。'],'我先判断方向时，是否把“其他条件不变”这一前提保留下来了？');

  add(11,2,'久期计算，先把基点换成小数',[
    '打开固定收益公式，辨认修正久期与收益率小幅变化，写下负号表示方向相反。',
    '先换算 100bp = 1 个百分点 = 0.01，再独立完成“久期 5、收益率下降 50bp”的自测。',
    '核对约上涨 2.5%，并注明忽略凸性、使用小变动近似；它不是任何债券情形的精确价格。'
  ],[lesson('fixed','理解久期与一阶近似'),check('fixed','手算 50bp 下降的价格变化'),words(['fixed','quant'],10,'复习 duration、basis point 与利率')],['基点能正确换成小数。','久期计算的符号、百分比结果与近似前提都已写清。'],'收益率下降时，公式中的两个负号分别来自哪里？');

  add(11,3,'把信用风险和利率风险分开',[
    '先练固定收益题，再练定量题；看到风险问题先判断是现金流偿付能力还是折现率变化。',
    '用中文各举一例：发行人可能还不起钱属于信用风险；要求收益率变动引起价格波动属于利率风险。',
    '把 credit risk 与 interest rate risk 写成两栏，补一句二者可能同时存在，但不是同一个概念。'
  ],[quiz('topic','练固定收益题','fixed'),quiz('topic','交错练定量题','quant'),words(['fixed','quant'],10,'看 credit risk 与利率相关词'),note('写信用风险与利率风险两栏表')],['两科基础题均已尝试。','能够独立给两类风险各举一个例子。'],'一家公司完全按时还款，债券价格为什么仍可能下跌？');

  add(12,1,'先回顾平均数、权重与波动',[
    '不看材料先说出：平均数描述什么，标准差描述什么，组合权重相加应为多少。',
    '打开定量与组合讲解核对，用两项权重 25%、75% 检查合计为 100%。',
    '在笔记解释“平均收益相同，波动仍可能不同”，不要用平均数代替风险描述。'
  ],[lesson('quant','回顾均值与标准差'),lesson('portfolio','回顾组合权重'),words(['portfolio','quant'],10,'认识 mean、risk 与 weight'),note('用一句话区分平均收益和波动')],['能够分别解释均值、权重与波动。','会检查组合权重合计是否为 1。'],'为什么只看平均收益，不能知道一路上会经历多大波动？');

  add(12,2,'手算组合收益与 CAPM',[
    '完成两资产组合收益自测；先将百分比权重写成小数，再进行加权相加。',
    '读组合讲解中的 CAPM：无风险利率 2%、市场预期收益 8%、beta 为 1.2 时，要求收益为 2% + 1.2 × (8% − 2%) = 9.2%。',
    '合上材料，解释系统性与非系统性风险的区别；分散化通常能降低后一类，不能消除全部市场风险。'
  ],[lesson('portfolio','理解组合与 CAPM'),check('portfolio','计算两资产组合收益'),note('手算 CAPM 并解释两类风险')],['组合收益与一个 CAPM 例子都已独立尝试。','能说明分散化不能消除哪一类风险。'],'为什么组合标准差不能直接照搬收益率的加权平均方法？');

  add(12,3,'把组合选择放回客户的真实需要',[
    '先做组合题，再做权益题，判断问题是在问收益、风险、分散化还是交易与估值。',
    '完成伦理情境题，结合客户目标、流动性需要与风险承受能力解释适当性。',
    '写一个短情境：客户下个月要付学费，为什么不能只因某投资预期收益高就建议投入全部学费资金？'
  ],[quiz('topic','做组合基础题','portfolio'),quiz('topic','交错练权益题','equity'),quiz('topic','结合适当性做伦理题','ethics'),note('写一个客户目标与投资选择的情境')],['三组少量基础题都已独立尝试。','适当性判断至少考虑一个收益之外的客户限制。'],'同一项投资，为什么对不同客户可能有不同的适当性结论？');

  add(13,1,'复习融资、债券与组合的词',[
    '打开词卡，先复习公司、固定收益与组合词，优先挑之前见过却说不清的词。',
    '把 shareholder、yield、weight、diversification 等词各配一句简单中文含义，不必硬背长英文定义。',
    '选两个仍混淆的词写在笔记中，后面学另类投资时留意它们怎样继续出现。'
  ],[words(['corporate','fixed','portfolio'],12,'回忆已学金融词'),note('记录两个仍混淆的术语')],['本轮词卡先回忆、后核对。','至少两个薄弱词有自己的中文解释。'],'哪些词只是换了投资类别，却仍表示相同的基本风险或现金流关系？');

  add(13,2,'用风险而非名字理解另类资产',[
    '读另类投资讲解，把私募、房地产、商品与基础设施分别列成四行。',
    '每行写一个需要核对的风险：交易是否容易、持有多久、估值是否依赖假设、是否使用杠杆或承担运营风险。',
    '比较两种结论：低流动性不等于没有风险，平滑的历史估值也不等于真实风险一定小；细分类别请回到官方教材。'

q.id]||'')}</textarea></div>`:''}`:''}<div class="quiz-bottom"><span>${submitted?'本次作答已保存，可随时退出。':'不确定也先选一个，再通过解析找缺口。'}</span>${submitted?btn(quiz.index===quiz.questions.length-1?'查看本轮回顾':'下一题','next-question'):btn('提交答案','submit-answer','primary-btn',quiz.selected===null?'disabled':'','check')}</div></section><aside class="card quiz-side"><h3>读题的小步骤</h3><p>01 找 most / least / except<br>02 标出已知量和单位<br>03 想清概念，再计算<br>04 排除选项后作答</p><div class="divider"></div><h3>英语先搭桥</h3><p>现在可以看中文。熟悉之后，先收起中文，再试一次英文。词义只记与金融有关的用法。</p><div class="divider"></div><p>小样本基础题不能预测考试分数。真正的计时模拟，请使用完整模拟卷。</p></aside></div>`;

  function submitAnswer() {
    if(!quiz || quiz.submitted || quiz.selected===null)return;
    const q=quiz.questions[quiz.index],correct=quiz.selected===q.answer;
    const attempt={questionId:q.id,correct,choice:quiz.selected,at:new Date().toISOString(),cause:null};
    state.attempts.push(attempt);state.attempts=state.attempts.slice(-2000);
    quiz.results.push({id:q.id,correct});quiz.submitted=true;
    if(!correct || state.questionReview[q.id]) schedule('questionReview',q.id,correct,false);
    save();render();
  }
  function resultPage() {
    const correct=quiz.results.filter(r=>r.correct).length,missed=quiz.results.filter(r=>!r.correct);
    return `${heading('认真复盘，比多做几题更有用。','把本轮最重要的一个缺口补上，再向前走。','A SMALL STEP, A CLEARER PICTURE')}<section class="card empty-state"><div class="score-ring"><strong>${correct}/${quiz.results.length}</strong><span>本轮答对</span></div><h3>${missed.length?'先把这几个地方补稳。':'基础练习完成，再练英文识题。'}</h3><p>${missed.length?missed.map(r=>topic(question(r.id).topic).name).filter((v,i,a)=>a.indexOf(v)===i).join(' · '):'试着合上解析，用自己的话讲一遍解题理由。'}</p><p class="result-note">这组题只用于入门诊断，难度、题量和覆盖面均不等同正式考试。${missed.length?'错题已收进错题本，并安排次日回顾。':'请继续使用官方考纲与完整题库补齐知识。'}</p><div class="result-actions">${taskContext()?btn('返回本项，检查完成标准','return-task','primary-btn','','arrow'):btn('返回练习中心','exit-quiz','light-btn','','')}${missed.length?btn('重做待修复错题','wrong-quiz'):taskContext()?'':btn('看看金融英语','go-english')}</div></section>`;

    return `${heading('英语先够用，再一点点变好。','不背大词表。先认识金融名词、问法、方向词和单位。','SMALL WORDS, BIG DIFFERENCE')}${scopedEnglishHTML()}<div class="card english-intro"><div><h2>先读懂题目在问什么。</h2><p>每次 8–12 个新词：先看英文 → 自己回忆 → 翻面核对。<br>答得出来，再点“记住了”；按 1 / 3 / 7 天安排复习。</p></div>${icon('language')}</div><div class="filter-group english-tab"><button class="chip ${englishTab==='words'?'active':''}" data-action="english-tab" data-tab="words">金融词卡 · ${D.vocabulary.length} 个</button><button class="chip ${englishTab==='reading'?'active':''}" data-action="english-tab" data-tab="reading">拆句读题 · ${D.reading.length} 句</button></div>${englishTab==='reading'?`<div class="reading-grid">${D.reading.filter(r=>!readingScope||readingScope.includes(r.id)).map(r=>`<article class="card reading-card"><h3>${esc(r.label)}</h3><p class="reading-en" lang="en">${esc(r.en)}</p><details><summary class="text-btn" style="margin-top:12px;cursor:pointer">展开中文与读题提示</summary><p class="reading-zh">${esc(r.zh)}</p><div class="reading-keywords">${r.keywords.map(k=>`<span>${esc(k)}</span>`).join('')}</div><p class="reading-tip">${esc(r.tip)}</p></details></article>`).join('')}</div>`:`<div class="toolbar"><div class="filter-group">${[['all','全部'],['new','还没学'],['due',`到期复习 ${dueVocab().length}`]].map(([v,label])=>`<button class="chip ${vocabFilter===v?'active':''}" data-action="word-filter" data-filter="${v}">${label}</button>`).join('')}</div><label class="search">${icon('search')}<input id="vocab-search" type="search" placeholder="搜索英文 / 中文" aria-label="搜索单词" value="${esc(vocabSearch)}"></label></div><div class="vocab-grid">${list.map(v=>{const open=revealed.has(v.id),r=state.vocab[v.id];return `<article class="card vocab-card"><div class="vocab-top"><span>${esc(topic(v.topic).name)}</span><span>${r?(r.due<=today()?'今天复习':`${shortDate(r.due)} 复习`):'新词'}</span></div><h3 lang="en">${esc(v.en)}</h3>${open?`<p class="zh">${esc(v.zh)}</p><p class="vocab-sentence" lang="en">${esc(v.sentence)}<em lang="zh-CN">${esc(v.meaning)}</em></p><div class="vocab-controls"><button data-action="word-again" data-id="${v.id}">还不熟</button><span>先回忆，再判断</span><button data-action="word-known" data-id="${v.id}">记住了 ${icon('check')}</button></div>`:`<button class="reveal-button" data-action="reveal" data-id="${v.id}">自己回忆一下，再点开释义</button><div class="vocab-controls"><span>${r?'让记忆再出现一次':'从一个词开始'}</span><span>点击翻面 ↗</span></div>`}</article>`;}).join('')||empty('这里暂时没有词卡',vocabFilter==='due'?'还没有到期的单词，先认识几个新词吧。':'换一个关键词，或查看全部词卡。')}</div>`}`;

  function schedule(kind,id,known,notify=true) {
    const previous=state[kind][id];
    if(known && previous && previous.last===today() && previous.due>today()) {if(notify)toast('今天已经安排好了，按到期时间再复习更有效。');return;}
    const reps=known?(previous?.reps||0)+1:0;
    const gap=known?[1,3,7,14][Math.min(3,reps-1)]:1;
    state[kind][id]={due:addDays(today(),gap),last:today(),reps};
    if(notify)toast(known?`已安排 ${gap} 天后回忆复习。`:'不着急，明天再试一次。');
  }

    $('#page-label').textContent=labels[currentPage];
    $('#today-date').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'long',day:'numeric',weekday:'long'}).format(new Date());

    else if(a==='learned'){schedule('reviewed',id,true);save();render();}
    else if(a==='quiz'){closeModal();startQuiz(b.dataset.mode);}
    else if(a==='topic-quiz'){closeModal();startQuiz('topic',id);}
    else if(a==='single-quiz'){startQuiz('single',id);}
    else if(a==='wrong-quiz'){closeModal();startQuiz('wrong');}
    else if(a==='review-quiz')startQuiz('review');
    else if(a==='exit-quiz'){quiz=null;render();scrollTop();}
    else if(a==='option'){if(quiz&&!quiz.submitted){quiz.selected=Number(b.dataset.index);render();}}
    else if(a==='submit-answer')submitAnswer();
    else if(a==='toggle-chinese'){quiz.showChinese=!quiz.showChinese;render();}
    else if(a==='next-question'){if(!quiz?.submitted)return;if(quiz.index===quiz.questions.length-1)quiz.finished=true;else{quiz.index++;quiz.selected=null;quiz.submitted=false;}render();scrollTop();}
    else if(a==='cause'){if(!quiz?.submitted)return;const q=quiz.questions[quiz.index];const attempt=state.attempts.at(-1);if(attempt?.questionId===q.id){attempt.cause=b.dataset.cause;save();render();}}
    else if(a==='english-tab'){englishTab=b.dataset.tab;render();}
    else if(a==='word-filter'){vocabFilter=b.dataset.filter;render();}
    else if(a==='due-words'){englishTab='words';vocabFilter='due';navigate('english');}
    else if(a==='reveal'){revealed.add(id);render();}
    else if(a==='word-known'||a==='word-again'){schedule('vocab',id,a==='word-known');save();revealed.delete(id);render();}
    else if(a==='export'){
      const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`拾级学习备份-${today()}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('备份已生成，请保存在你能找到的位置。');
    }
    else if(a==='reset-confirm')modal('清空前，再确认一次',`<p class="source-note">这会删除此浏览器中的打卡、答题、笔记和复习记录，无法撤销。考试日期与每日时长会恢复为 11 月 11 日、每天 4 小时。建议先导出备份。</p><div class="settings-actions">${btn('先导出备份','export','outline-btn','','download')}${btn('返回设置','settings','light-btn','','')}${btn('确认清空','reset','outline-btn','','')}</div>`);
    else if(a==='reset'){state=defaults();save();quiz=null;revealed.clear();activeTopic=null;wordScope=null;readingScope=null;closeModal();navigate('today');toast('学习记录已清空。可以重新开始。');}
    else if(a==='timer-duration'){stopTimer();timer.minutes=Number(b.dataset.minutes);timer.seconds=timer.minutes*60;focusModal();render();}
    else if(a==='timer-reset'){stopTimer();timer.seconds=timer.minutes*60;focusModal();render();}
    else if(a==='timer-toggle'){if(timer.running){tick();stopTimer();}else{if(timer.seconds===0)timer.seconds=timer.minutes*60;timer.end=Date.now()+timer.seconds*1000;timer.running=true;timer.interval=setInterval(tick,500);}focusModal();render();}
  });
  document.addEventListener('change',e=>{
    if(e.target.matches('[data-task]')){
      const n=Number(e.target.dataset.day),id=e.target.dataset.task,key=dateForDay(n),set=new Set(state.tasks[key]||[]);if(e.target.checked)set.add(id);else set.delete(id);state.tasks[key]=[...set];save();render();
      if($('#modal').open && $('#modal-content [data-task]'))dayModal(n);
    }
    if(e.target.id==='import-file')importFile(e.target.files[0]);
  });
  document.addEventListener('input',e=>{
    if(e.target.matches('[data-note],[data-question-note],[data-task-note]')){const kind=e.target.dataset.taskNote?'taskNotes':e.target.dataset.note?'notes':'questionNotes',id=e.target.dataset.taskNote||e.target.dataset.note||e.target.dataset.questionNote;state[kind][id]=e.target.value.slice(0,10000);clearTimeout(noteTimer);noteTimer=setTimeout(save,300);}
    if(e.target.id==='vocab-search'||e.target.id==='knowledge-search'){
      const el=e.target,id=el.id,pos=el.selectionStart;if(id==='vocab-search')vocabSearch=el.value;else knowledgeSearch=el.value;render();const replacement=$('#'+id);replacement.focus();try{replacement.setSelectionRange(pos,pos);}catch(_){}
    }
  });
  document.addEventListener('submit',e=>{
    if(e.target.id!=='settings-form')return;e.preventDefault();const date=$('#exam-date').value,hours=Number($('#study-hours').value);
    if(!validDate(date)||![2,4,6].includes(hours))return toast('请填写有效日期与学习时间。');
    if(state.examDate!==date)state.activeTask=null;state.examDate=date;state.hours=hours;save();closeModal();render();toast('已更新，计划会随考试日期与可用时间调整。');
  });
  let pendingImport=null;
  async function importFile(file) {
    if(!file)return;
    if(file.size>5*1024*1024)return toast('文件过大，请选择 5 MB 以内的学习备份。');
    try{
      pendingImport=normalize(JSON.parse(await file.text()));
      modal('导入这份学习记录？',`<p class="source-note">备份包含 ${pendingImport.attempts.length} 次作答记录、${Object.keys(pendingImport.vocab).length} 个词卡复习安排。导入会替换当前浏览器的学习数据。</p><p class="source-note">建议先导出当前备份。确认后，考试日期将设为 ${esc(pendingImport.examDate)}，每天 ${pendingImport.hours} 小时。</p><div class="settings-actions">${btn('先备份当前记录','export','outline-btn','','download')}${btn('取消','settings','light-btn','','')}${btn('确认导入','confirm-import','primary-btn','','check')}</div>`);
    }catch(_){pendingImport=null;toast('无法读取备份，请使用本站导出的有效 JSON 文件。');}
  }
  document.addEventListener('click',e=>{if(e.target.closest('[data-action="confirm-import"]')&&pendingImport){state=pendingImport;pendingImport=null;quiz=null;revealed.clear();wordScope=null;readingScope=null;save();closeModal();if(state.activeTask)openTask(state.activeTask.day,state.activeTask.task);else navigate('today');toast('备份已导入。');}});
  $('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
  function applyRoute(scroll=false) {
    const hash=location.hash.slice(1),taskMatch=hash.match(/^task\/(\d+)\/(\d+)$/),dayMatch=hash.match(/^day\/(\d+)$/);
    if(taskMatch&&D.days[Number(taskMatch[1])-1]?.tasks[Number(taskMatch[2])-1]){
      const day=Number(taskMatch[1]),task=Number(taskMatch[2]);
      state.activeTask={day,task,date:dateForDay(day)};save();currentPage='task';
    }else if(dayMatch&&D.days[Number(dayMatch[1])-1]){
      summaryDay=Number(dayMatch[1]);currentPage='day';
    }else currentPage=['today','plan','knowledge','practice','english'].includes(hash)?hash:'today';
    render();if(scroll)scrollTop();
  }
  window.addEventListener('hashchange',()=>applyRoute(true));
  window.addEventListener('beforeunload',()=>{if(noteTimer)save();});
  applyRoute();
})();

</script>
</body>
</html>

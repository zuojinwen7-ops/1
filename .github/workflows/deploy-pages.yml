name: Publish study website

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/build.py'
      - 'styles.css'
      - 'study-data.js'
      - 'app.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v4
      - name: Build the standalone website
        run: python3 scripts/build.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
